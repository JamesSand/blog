        <aside class="blog-sidebar">
          <div class="blog-card">
            <div class="blog-avatar"><img src="{{ site.Params.mainsite }}/images/profile.jpg" alt="Zhizhou Sha"></div>
            <h2 class="blog-author"><span class="en">Zhizhou Sha</span><span class="zh">沙之洲</span></h2>
            <p class="blog-author-tagline"><span class="en">Notes</span><span class="zh">笔记</span></p>
            <div class="blog-stats">
              <a class="blog-stat" href="{{ site.Home.RelPermalink }}">
                <strong>{{ len (where site.RegularPages "Section" "posts") }}</strong>
                <span><span class="en">Posts</span><span class="zh">文章</span></span>
              </a>
              <a class="blog-stat" href="{{ "tags/" | relURL }}">
                <strong>{{ len site.Taxonomies.tags }}</strong>
                <span><span class="en">Tags</span><span class="zh">标签</span></span>
              </a>
            </div>
            <nav class="blog-sidebar-nav" aria-label="Blog navigation">
              <a href="{{ site.Home.RelPermalink }}"{{ if .IsHome }} aria-current="page"{{ end }}>
                <span class="blog-nav-icon" aria-hidden="true"><svg width="18" height="18"><use href="#i-home"/></svg></span>
                <span class="en">Main</span><span class="zh">首页</span>
              </a>
              <a href="{{ "tags/" | relURL }}"{{ if eq .Kind "taxonomy" }} aria-current="page"{{ end }}>
                <span class="blog-nav-icon" aria-hidden="true"><svg width="18" height="18"><use href="#i-tag"/></svg></span>
                <span class="en">Tags</span><span class="zh">标签</span>
              </a>
            </nav>
            <p class="blog-sidebar-footer">© 2025 - {{ now.Year }} Zhizhou Sha</p>
          </div>
        </aside>
