baseURL = 'https://jamessand.github.io/blog/'
languageCode = 'en-us'
title = "Zhizhou Sha's Blog"

[params]
  mainsite = 'https://jamessand.github.io'

[pagination]
  pagerSize = 12

[markup.highlight]
  noClasses = true
  style = 'github-dark'

# Leave $...$ and $$...$$ untouched so KaTeX can render them; pages opt in with `math = true`.
[markup.goldmark.extensions.passthrough]
  enable = true
  [markup.goldmark.extensions.passthrough.delimiters]
    block = [['$$', '$$']]
    inline = [['$', '$']]

[caches]
  [caches.images]
    dir = ':cacheDir/images'
